<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Code17 — 코드로 여는 17개의 목표</title>
<meta name="description" content="SDGs 17개 목표마다 개발자가 서비스로 기여할 수 있는 방법을 Windows 11 스타일 데스크톱에서 살펴봅니다.">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link rel="stylesheet" href="code17/style.css">
</head>
<body>

<!-- 배경화면 -->
<div id="wallpaper" aria-hidden="true">
  <svg viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
    <defs>
      <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="18"/></filter>
      <filter id="softer" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
      <radialGradient id="petalA" cx="30%" cy="30%" r="80%">
        <stop offset="0" stop-color="var(--wp-p1)"/><stop offset="1" stop-color="var(--wp-p2)"/>
      </radialGradient>
      <radialGradient id="petalB" cx="70%" cy="20%" r="90%">
        <stop offset="0" stop-color="var(--wp-p3)"/><stop offset="1" stop-color="var(--wp-p2)"/>
      </radialGradient>
    </defs>
    <rect width="1600" height="1000" fill="var(--wp-bg)"/>
    <ellipse cx="800" cy="560" rx="520" ry="360" fill="var(--wp-glow)" filter="url(#softer)" opacity=".8"/>
    <g id="bloom" transform="translate(800 600)" filter="url(#soft)"></g>
  </svg>
</div>

<!-- 바탕화면 아이콘 -->
<main id="desktop" aria-label="바탕화면">
  <div id="icons" role="list"></div>
  <div id="windows"></div>
  <div id="snap-preview"></div>
</main>

<!-- 시작 메뉴 -->
<section id="start" class="flyout" aria-label="시작 메뉴" hidden>
  <div class="start-search">
    <svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 20 20"/></svg>
    <input id="start-q" type="search" placeholder="목표, 서비스 아이디어 검색" autocomplete="off">
  </div>
  <div id="start-body">
    <div class="start-head"><h2>고정됨 · SDGs 17개 목표</h2></div>
    <div id="start-pinned" class="start-grid"></div>
    <div class="start-head"><h2>앱</h2></div>
    <div id="start-apps" class="start-apps"></div>
  </div>
  <div id="start-results" hidden></div>
  <footer class="start-foot">
    <div class="user"><span class="avatar">D</span><span>개발자</span></div>
    <button class="icon-btn" id="power" title="전원" aria-label="전원">
      <svg viewBox="0 0 24 24"><path d="M12 3v8"/><path d="M6.3 6.8a8 8 0 1 0 11.4 0"/></svg>
    </button>
  </footer>
</section>

<!-- 위젯 -->
<section id="widgets" class="flyout" aria-label="위젯" hidden></section>

<!-- 빠른 설정 -->
<section id="quick" class="flyout" aria-label="빠른 설정" hidden>
  <div class="qs-grid">
    <button class="qs" data-qs="theme"><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg><span>어두운 테마</span></button>
    <button class="qs" data-qs="motion"><svg viewBox="0 0 24 24"><path d="M4 12h4l2-5 4 10 2-5h4"/></svg><span>애니메이션</span></button>
    <button class="qs" data-qs="focus"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/></svg><span>집중 모드</span></button>
    <button class="qs" data-qs="wall"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 16 5-5 4 4 3-3 6 6"/></svg><span>배경 바꾸기</span></button>
  </div>
  <label class="qs-slider"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.4 1.4M17.6 17.6 19 19M5 19l1.4-1.4M17.6 6.4 19 5"/></svg>
    <input id="bright" type="range" min="60" max="100" value="100" aria-label="화면 밝기"></label>
  <div class="qs-foot"><span>Code17 · SDGs Edition</span>
    <button class="icon-btn" data-open="settings" title="설정" aria-label="설정"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg></button>
  </div>
</section>

<!-- 달력 / 알림 -->
<section id="calendar" class="flyout" aria-label="알림 및 달력" hidden>
  <div id="notifs"></div>
  <div class="cal-card"><div id="cal-title"></div><div id="cal-grid"></div></div>
</section>

<!-- 작업 표시줄 -->
<footer id="taskbar">
  <button class="tb-widgets" id="tb-widgets" aria-label="위젯">
    <span class="w-badge">17</span><span class="w-text"><b>SDGs</b><small>오늘의 목표</small></span>
  </button>
  <nav class="tb-center" id="tb-center">
    <button class="tb-btn" id="tb-start" aria-label="시작" title="시작"></button>
    <button class="tb-btn" id="tb-search" aria-label="검색" title="검색"></button>
    <div id="tb-apps"></div>
  </nav>
  <div class="tb-tray">
    <button class="tray-btn" id="tray-quick" aria-label="빠른 설정">
      <svg viewBox="0 0 24 24"><path d="M2 9a15 15 0 0 1 20 0"/><path d="M5.5 12.5a10 10 0 0 1 13 0"/><path d="M9 16a5 5 0 0 1 6 0"/><circle cx="12" cy="19" r=".8"/></svg>
      <svg viewBox="0 0 24 24"><path d="M4 9h3l5-4v14l-5-4H4z"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></svg>
      <svg viewBox="0 0 24 24"><rect x="2" y="7" width="18" height="10" rx="2"/><path d="M22 11v2"/><rect x="4" y="9" width="11" height="6" rx=".5" class="fill"/></svg>
    </button>
    <button class="tray-btn clock" id="tray-clock" aria-label="알림 및 달력"><span id="clock-t"></span><span id="clock-d"></span><i id="notif-dot"></i></button>
  </div>
</footer>

<!-- 우클릭 메뉴 -->
<div id="ctx" class="ctx" hidden></div>
<!-- 토스트 -->
<div id="toast" aria-live="polite"></div>

<!-- 잠금 화면 -->
<section id="lock" aria-label="잠금 화면">
  <div class="lock-time"><div id="lock-clock"></div><div id="lock-date"></div></div>
  <div class="lock-hint">
    <div class="lock-logo"><b>Code17</b><span>코드로 여는 17개의 목표</span></div>
    <span>클릭하거나 아무 키나 눌러 시작하기</span>
  </div>
</section>

<!-- 종료 화면 -->
<section id="shutdown" hidden><div class="spinner"></div><p>종료하는 중...</p></section>

<script src="code17/data.js"></script>
<script src="code17/os.js"></script>
</body>
</html>
