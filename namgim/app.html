<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>남김없이 — 우리 집 냉장고 지킴이</title>
<meta name="description" content="냉장고 재료의 소비기한을 관리하고, 임박 재료로 만들 요리를 추천하고, 남는 음식은 나눠서 음식물 쓰레기를 줄이는 서비스">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="app.css">
<script src="theme.js"></script>
</head>
<body>
<div class="st app">
  <nav class="st-nav scroll" id="nav" aria-label="메뉴">
    <div class="brand"><span class="logo">🧊</span><div><b>남김없이</b><small>우리 집 냉장고 지킴이</small></div></div>

    <button data-p="data"><span class="ni">⚙️</span>데이터</button>

  <main class="st-main scroll" id="main"></main>

<button class="fab" id="fab" aria-label="재료 추가">＋</button>
<div id="dlg-wrap" hidden><div class="dlg" role="dialog" aria-modal="true"></div></div>

<script src="store.js"></script>
<script src="recipes.js"></script>
<script src="app.js"></script>
