function setScene(name) {
  params.scene = name;
  gui.controllers[0].updateDisplay();
  loadScene(name);
}

const PR = 0.3; // 플레이어 반경
function updatePlayer(dt) {
  const fwd = new THREE.Vector3(-Math.sin(player.yaw), 0, -Math.cos(player.yaw));
  const right = new THREE.Vector3(Math.cos(player.yaw), 0, -Math.sin(player.yaw));
  const wish = new THREE.Vector3();
  if (keys.has('KeyW')) wish.add(fwd);
  if (keys.has('KeyS')) wish.sub(fwd);
  if (keys.has('KeyD')) wish.add(right);
  if (keys.has('KeyA')) wish.sub(right);
  if (player.fly) {
    if (keys.has('Space')) wish.y += 1;
    if (keys.has('KeyC') || keys.has('ControlLeft')) wish.y -= 1;
    if (keys.has('KeyW') || keys.has('KeyS')) {
      // 비행 모드에서는 바라보는 방향(피치 포함)으로 이동
      const s = (keys.has('KeyW') ? 1 : 0) - (keys.has('KeyS') ? 1 : 0);
      wish.y += Math.sin(player.pitch) * s;
    }
  }
  if (wish.lengthSq() > 0) wish.normalize();
  const run = keys.has('ShiftLeft') || keys.has('ShiftRight');
  const speed = params.walkSpeed * (run ? 2.6 : 1) * (player.fly ? 4 : 1);
  player.vel.lerp(wish.multiplyScalar(speed), 1 - Math.exp(-dt * 12));
  if (player.vel.lengthSq() < 1e-6) player.vel.set(0, 0, 0);
  const p = player.pos;
  p.addScaledVector(player.vel, dt);

  // 바닥 높이 (낮은 박스 = 계단처럼 올라섬)
  let floorY = 0;
  const feet = p.y - player.eyeY;
  for (const c of colliders) {
    if (p.x < c.min[0] || p.x > c.max[0] || p.z < c.min[2] || p.z > c.max[2]) continue;
    if (c.max[1] - feet <= 0.45 && c.max[1] > floorY) floorY = c.max[1];
  }
  if (!player.fly) {
    const target = floorY + player.eyeY;
    p.y += (target - p.y) * (1 - Math.exp(-dt * 18));
  } else if (p.y < floorY + 0.5) p.y = floorY + 0.5;

  // 수평 충돌 (원 vs AABB)
  const fy = p.y - (player.fly ? 0.5 : player.eyeY), hy = p.y + 0.1;
  for (let iter = 0; iter < 2; iter++) {
    for (const c of colliders) {
      if (c.max[1] <= fy + 0.45 || c.min[1] >= hy) continue;
      const qx = Math.max(c.min[0], Math.min(p.x, c.max[0]));
      const qz = Math.max(c.min[2], Math.min(p.z, c.max[2]));
      const dx = p.x - qx, dz = p.z - qz;
      const d2 = dx * dx + dz * dz;
      if (d2 >= PR * PR) continue;
      if (d2 > 1e-8) {
        const d = Math.sqrt(d2), push = PR - d;
        p.x += (dx / d) * push; p.z += (dz / d) * push;
      } else {
        // 박스 내부: 가장 가까운 면으로 밀어냄
        const ex = [p.x - c.min[0], c.max[0] - p.x, p.z - c.min[2], c.max[2] - p.z];
        const k = ex.indexOf(Math.min(...ex));
        if (k === 0) p.x = c.min[0] - PR; else if (k === 1) p.x = c.max[0] + PR;
        else if (k === 2) p.z = c.min[2] - PR; else p.z = c.max[2] + PR;
      }
    }
  }
  camera.position.copy(p);
  camera.rotation.set(player.pitch, player.yaw, 0, 'YXZ');
  camera.updateMatrixWorld(true);
}

// ---------------------------------------------------------------------------
// Scene upload
// ---------------------------------------------------------------------------
let current = null;     // { sb, spawn, env }
let bvhBuffer, geoBuffer, nrmBuffer, matBuffer;
let triCount = 0;

function uploadScene(sb) {
  const t0 = performance.now();
  if (sb.triCount < 2) { sb.tri([0, -100, 0], [0.01, -100, 0], [0, -100, 0.01], null, null, null, sb.material({})); sb.tri([0, -100, 0], [0.01, -100, 0], [0, -100, 0.01], null, null, null, 0); }
  const bvh = buildBVH(sb);
  const matBuf = packMaterials(sb.mats);
  for (const b of [bvhBuffer, geoBuffer, nrmBuffer, matBuffer]) if (b) b.destroy();
  const mk = (data) => {
    const b = device.createBuffer({ size: Math.max(16, data.byteLength), usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST });
    device.queue.writeBuffer(b, 0, data);
    return b;
  };
  bvhBuffer = mk(bvh.nodeBuf); geoBuffer = mk(bvh.geo); nrmBuffer = mk(bvh.nrm); matBuffer = mk(matBuf);
  triCount = sb.triCount;
  colliders = sb.colliders;
  hTris.textContent = triCount.toLocaleString();
  console.log(`scene: ${triCount} tris, ${bvh.nodeCount} nodes, BVH ${(performance.now() - t0).toFixed(0)} ms`);
  rebuildBindGroups();
  resetAccum();
}

function loadScene(name) {
  hStatus.textContent = 'building scene';
  current = SCENES[name]();
  const e = current.env;
  Object.assign(params, { sunAzimuth: e.sunAzimuth, sunElevation: e.sunElevation, sunIntensity: e.sunIntensity, fog: e.fog, godrays: e.godrays, exposure: e.exposure });
  gui.controllersRecursive().forEach((c) => c.updateDisplay());
  player.pos.fromArray(current.spawn.pos);
  player.yaw = current.spawn.yaw; player.pitch = current.spawn.pitch;
  player.vel.set(0, 0, 0); player.fly = false;
  uploadScene(current.sb);
}

function addPrimitive(kind) {
  const sb = current.sb;
  const f = new THREE.Vector3(-Math.sin(player.yaw), 0, -Math.cos(player.yaw));
  const c = player.pos.clone().addScaledVector(f, 5);
  const col = new THREE.Color().setHSL(Math.random(), 0.6, 0.5);
  if (kind === 'sphere') {
    const r = 0.9;
    const m = sb.material({ albedo: [col.r, col.g, col.b], rough: Math.random() < 0.5 ? 0.05 : 0.5, metal: Math.random() < 0.4 ? 1 : 0 });
    sb.sphere([c.x, r, c.z], r, m, 32, 20);
    sb.colliders.push({ min: [c.x - r, 0, c.z - r], max: [c.x + r, 2 * r, c.z + r] });
  } else {
    const m = sb.material({ albedo: [col.r, col.g, col.b], rough: 0.4 });
    sb.box(c.x - 0.7, 0, c.z - 0.7, c.x + 0.7, 1.4, c.z + 0.7, m, { collide: true });
  }
  uploadScene(sb);
}

function loadFile() {
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = '.obj,.gltf,.glb';
  inp.onchange = () => {
    const file = inp.files[0];
    if (!file) return;
    const url = URL.createObjectURL(file);
    const ext = file.name.split('.').pop().toLowerCase();
    const onLoad = (obj) => {
      const root = obj.scene || obj;
      // 플레이어 앞 6m 지점, 최대 4m 크기로 배치
      const box = new THREE.Box3().setFromObject(root);
      const size = box.getSize(new THREE.Vector3());
      const s = 4 / Math.max(size.x, size.y, size.z, 1e-6);
      root.scale.multiplyScalar(s);
      root.updateMatrixWorld(true);
      box.setFromObject(root);
      const f = new THREE.Vector3(-Math.sin(player.yaw), 0, -Math.cos(player.yaw));
      const target = player.pos.clone().addScaledVector(f, 6);
      const ctr = box.getCenter(new THREE.Vector3());
      root.position.add(new THREE.Vector3(target.x - ctr.x, -box.min.y, target.z - ctr.z));
      root.traverse((o) => { if (o.isMesh) current.sb.fromThreeMesh(o); });
      uploadScene(current.sb);
      URL.revokeObjectURL(url);
    };
    if (ext === 'obj') new OBJLoader().load(url, onLoad);
    else new GLTFLoader().load(url, onLoad);
  };
  inp.click();
}

// ---------------------------------------------------------------------------
// Resolution-dependent resources
//   버퍼/텍스처는 최대 해상도로 한 번만 만들고, 실제 렌더 크기는 유니폼으로 지정
//   → 자동 해상도가 바뀌어도 재할당/누적 리셋 없이 재투영으로 이어진다.
// ---------------------------------------------------------------------------
let maxW = 1, maxH = 1;
let histA, histB, colorTex, depthTex;
let bgAB, bgBA, displayBG;
let ping = 0;
let rw = 1, rh = 1, prevW = 1, prevH = 1;
let needReset = true;
let staticFrames = 0;

function createResources() {
  for (const r of [histA, histB, colorTex, depthTex]) if (r) r.destroy();
  const bytes = maxW * maxH * 32;
  histA = device.createBuffer({ size: bytes, usage: GPUBufferUsage.STORAGE });
  histB = device.createBuffer({ size: bytes, usage: GPUBufferUsage.STORAGE });
  const tex = (fmt) => device.createTexture({ size: [maxW, maxH], format: fmt, usage: GPUTextureUsage.STORAGE_BINDING | GPUTextureUsage.TEXTURE_BINDING | GPUTextureUsage.COPY_SRC });
  colorTex = tex('rgba16float');
  depthTex = tex('r32float');
  displayBG = device.createBindGroup({
    layout: displayBGL,
    entries: [
      { binding: 0, resource: colorTex.createView() },
      { binding: 1, resource: depthTex.createView() },
      { binding: 2, resource: { buffer: dispUniform } },
    ],
  });
  rebuildBindGroups();
  resetAccum();
}

function rebuildBindGroups() {
  if (!histA || !bvhBuffer) return;
  const mk = (src, dst) => device.createBindGroup({
    layout: computeBGL,
    entries: [
      { binding: 0, resource: { buffer: uniformBuffer } },
      { binding: 1, resource: { buffer: bvhBuffer } },
      { binding: 2, resource: { buffer: geoBuffer } },
      { binding: 3, resource: { buffer: nrmBuffer } },
      { binding: 4, resource: { buffer: matBuffer } },
      { binding: 5, resource: { buffer: src } },
      { binding: 6, resource: { buffer: dst } },
      { binding: 7, resource: colorTex.createView() },
      { binding: 8, resource: depthTex.createView() },
    ],
  });
  bgAB = mk(histA, histB);
  bgBA = mk(histB, histA);
}

function resetAccum() { needReset = true; staticFrames = 0; }

function resize(force) {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const cssW = Math.max(1, canvas.clientWidth), cssH = Math.max(1, canvas.clientHeight);
  canvas.width = Math.floor(cssW * dpr); canvas.height = Math.floor(cssH * dpr);
  camera.aspect = cssW / cssH;
  camera.updateProjectionMatrix();
  // 최대 렌더 해상도 = CSS 픽셀 * maxRes (스토리지 바인딩 한도 내)
  let mw = Math.max(1, Math.floor(cssW * params.maxRes)), mh = Math.max(1, Math.floor(cssH * params.maxRes));
  const limit = Math.floor(device.limits.maxStorageBufferBindingSize / 32);
  if (mw * mh > limit) { const k = Math.sqrt(limit / (mw * mh)); mw = Math.floor(mw * k); mh = Math.floor(mh * k); }
  mw = Math.min(mw, device.limits.maxTextureDimension2D); mh = Math.min(mh, device.limits.maxTextureDimension2D);
  if (force || mw !== maxW || mh !== maxH) { maxW = mw; maxH = mh; createResources(); }
}
window.addEventListener('resize', () => resize(false));

// ---------------------------------------------------------------------------
// Sky / sun from elevation (시간대에 따라 하늘 색 자동)
// ---------------------------------------------------------------------------
function computeSky() {
  const el = params.sunElevation, az = params.sunAzimuth;
  const day = smoothstep(0.0, 0.55, el);
  const up = smoothstep(-0.14, 0.04, el);
  const zenith = lerp3([0.003, 0.005, 0.014], lerp3([0.10, 0.17, 0.38], [0.10, 0.25, 0.62], day), up);
  const horizon = lerp3([0.008, 0.012, 0.024], lerp3([1.05, 0.52, 0.26], [0.62, 0.74, 0.90], day), up);
  const ground = lerp3([0.004, 0.004, 0.005], [0.10, 0.09, 0.08], up);
  let tint = lerp3([1.0, 0.36, 0.10], [1.0, 0.93, 0.84], smoothstep(0.0, 0.5, el));
  let dir, E, radius = 0.02;
  if (el > -0.03) {
    dir = [Math.cos(el) * Math.cos(az), Math.sin(el), Math.cos(el) * Math.sin(az)];
    const k = params.sunIntensity * smoothstep(-0.03, 0.05, el) * (0.45 + 0.55 * smoothstep(0.0, 0.4, el));
    E = tint.map((c) => c * k);
  } else {
    // 달빛
    const mel = 0.75, maz = az + Math.PI;
    dir = [Math.cos(mel) * Math.cos(maz), Math.sin(mel), Math.cos(mel) * Math.sin(maz)];
    tint = [0.55, 0.65, 1.0];
    const k = 0.07 * smoothstep(-0.03, -0.2, el);
    E = tint.map((c) => c * k);
    radius = 0.015;
  }
  const night = 1 - smoothstep(-0.12, 0.06, el);
  const cosMax = Math.cos(radius);
  const solid = 2 * Math.PI * (1 - cosMax);
  return { zenith, horizon, ground, tint, dir, E, cosMax, solid, night };
}

// ---------------------------------------------------------------------------
// Uniform update
// ---------------------------------------------------------------------------
const prevVP = new THREE.Matrix4();
const curVP = new THREE.Matrix4();
const lastView = new Float32Array(16);
let frameIndex = 0;

function writeUniforms(isStatic) {
  const ip = camera.projectionMatrixInverse.elements, iv = camera.matrixWorld.elements;
  for (let i = 0; i < 16; i++) { uF[i] = ip[i]; uF[16 + i] = iv[i]; uF[32 + i] = prevVP.elements[i]; }
  uF[48] = camera.position.x; uF[49] = camera.position.y; uF[50] = camera.position.z; uF[51] = frameIndex;
  uU[52] = rw; uU[53] = rh; uU[54] = prevW; uU[55] = prevH;
  const flags = (needReset ? 1 : 0) | (isStatic ? 2 : 0) | (current?.env.wheat ? 4 : 0);
  uU[56] = params.bounces; uU[57] = flags; uU[58] = 0; uU[59] = 0;
  const s = computeSky();
  uF.set([...s.dir, s.cosMax], 60);
  uF.set([...s.E, s.solid], 64);
  uF.set([...s.tint, s.night], 68);
  uF.set([...s.zenith, params.fog], 72);
  uF.set([...s.horizon, params.godrays], 76);
  uF.set([...s.ground, params.envIntensity], 80);
  uF.set([4096, 24, performance.now() / 1000, 48], 84);
  device.queue.writeBuffer(uniformBuffer, 0, uF);
}

// ---------------------------------------------------------------------------
// Main loop: GPU 백프레셔(최대 2프레임 in-flight) + 자동 해상도
// ---------------------------------------------------------------------------
let inFlight = 0;
let lastT = performance.now();
let fpsT = lastT, fpsN = 0, fpsV = 0;
let lastMoveT = 0, lastAdjustT = 0, lastDownT = 0;

function adaptResolution(now) {
  if (!params.autoRes) return;
  if (now - lastAdjustT < 600 || fpsV === 0) return;
  const moving = now - lastMoveT < 1500;
  if (!moving && fpsV >= 24) return; // 정지 상태에서는 수렴 품질을 위해 유지
  lastAdjustT = now;
  const t = params.targetFps;
  if (fpsV < t - 3) {
    params.resScale = Math.max(0.25, params.resScale * Math.max(0.7, Math.sqrt(fpsV / t)));
    lastDownT = now;
  } else if (fpsV > t + 10 && now - lastDownT > 2500) {
    params.resScale = Math.min(1.0, params.resScale * 1.07);
  }
}

function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.1, (now - lastT) / 1000);
  lastT = now;
  updatePlayer(dt);
  if (!current || !bgAB) return;
  if (inFlight >= 2) return;

  adaptResolution(now);
  const scale = params.resScale;
  rw = Math.max(1, Math.min(maxW, Math.floor(maxW * scale)));
  rh = Math.max(1, Math.min(maxH, Math.floor(maxH * scale)));

  // 카메라 정지 여부
  const vm = camera.matrixWorld.elements;
  let same = true;
  for (let i = 0; i < 16; i++) if (Math.abs(vm[i] - lastView[i]) > 1e-6) { same = false; break; }
  lastView.set(vm);
  if (!same) lastMoveT = now;
  const isStatic = same && rw === prevW && rh === prevH && !needReset;
  staticFrames = isStatic ? staticFrames + 1 : 0;

  camera.updateProjectionMatrix();
  writeUniforms(isStatic);
  dF.set([rw, rh, 1 / rw, 1 / rh, canvas.width, canvas.height, params.exposure, 0.35, params.denoise, 0, 0, 0]);
  device.queue.writeBuffer(dispUniform, 0, dF);

  const cmd = device.createCommandEncoder();
  const pass = cmd.beginComputePass();
  pass.setPipeline(computePipeline);
  pass.setBindGroup(0, ping === 0 ? bgAB : bgBA);
  pass.dispatchWorkgroups(Math.ceil(rw / 8), Math.ceil(rh / 8));
  pass.end();
  const rpass = cmd.beginRenderPass({
    colorAttachments: [{ view: ctx.getCurrentTexture().createView(), loadOp: 'clear', storeOp: 'store', clearValue: { r: 0, g: 0, b: 0, a: 1 } }],
  });
  rpass.setPipeline(displayPipeline);
  rpass.setBindGroup(0, displayBG);
  rpass.draw(3);
  rpass.end();
  device.queue.submit([cmd.finish()]);
  inFlight++;
  device.queue.onSubmittedWorkDone().then(() => { inFlight--; fpsN++; });

  ping ^= 1;
  needReset = false;
  prevW = rw; prevH = rh;
  curVP.multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse);
  prevVP.copy(curVP);
  frameIndex++;

  if (now - fpsT > 500) { fpsV = Math.round(fpsN * 1000 / (now - fpsT)); fpsN = 0; fpsT = now; }
  hFps.textContent = fpsV;
  hRes.textContent = `${rw}x${rh} (${Math.round(scale * 100)}%)`;
  hSpp.textContent = isStatic ? staticFrames + 1 : '재투영';
  hStatus.textContent = `${player.fly ? '비행' : '걷기'} · ${Object.keys(SCENE_LABELS).find((k) => SCENE_LABELS[k] === params.scene)}`;
}

// ---------------------------------------------------------------------------
// Boot
// ---------------------------------------------------------------------------
resize(true);
loadScene(params.scene);
requestAnimationFrame(frame);
window.__pt = { params, player, setScene, get fps() { return fpsV; }, debug: { device, get colorTex() { return colorTex; }, get size() { return [rw, rh]; } } };
</script>
</body>
</html>
