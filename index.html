<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>GPU Path Tracer — Data-Oriented</title>
    <style>
        body { margin: 0; overflow: hidden; background:#0a0a0c; font-family: ui-sans-serif, system-ui, sans-serif; }
        canvas { display: block; width: 100vw; height: 100vh; }
        #ui { position: absolute; top: 14px; left: 16px; color:#fff; z-index: 10; pointer-events:none;
              text-shadow: 0 1px 3px rgba(0,0,0,.6); }
        #ui h2 { margin:0 0 2px; font-weight:600; letter-spacing:.3px; font-size:18px; }
        #ui p  { margin:0; font-size:13px; opacity:.85; font-variant-numeric: tabular-nums; }
        #ui .hint { margin-top:6px; font-size:12px; opacity:.6; }
        #help { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 10; pointer-events: none;
                background: rgba(18,22,30,.82); color: #dde4ef; border: 1px solid rgba(140,160,200,.25); border-radius: 12px;
                padding: 10px 16px; font-size: 12.5px; line-height: 1.7; text-align: center; transition: opacity .3s; }
        #help b { color: #ffd27f; }
        body.locked #help { opacity: 0; }
        #cross { position: fixed; left: 50%; top: 50%; width: 4px; height: 4px; margin: -2px 0 0 -2px; border-radius: 50%;
                 background: rgba(255,255,255,.8); box-shadow: 0 0 2px #000; pointer-events: none; z-index: 9; display: none; }
        body.locked #cross { display: block; }
        #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 20;
                   background: rgba(10,10,12,.55); color: #fff; font-size: 15px; letter-spacing: .3px; pointer-events: none; }
        @media (max-width: 600px) { #help { font-size: 11px; width: calc(100% - 48px); } }
    </style>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
                "three/examples/jsm/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
                "three-mesh-bvh": "https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.7.0/build/index.module.js",
                "three-gpu-pathtracer": "https://cdn.jsdelivr.net/npm/three-gpu-pathtracer@0.0.21/build/index.module.js",
                "lil-gui": "https://cdn.jsdelivr.net/npm/lil-gui@0.19.1/dist/lil-gui.esm.min.js"
            }
        }
    </script>
</head>
<body>
    <div id="ui">
        <h2>Web GPU Raytracer</h2>
        <p id="samples-info">Samples: 0</p>
    </div>
    <div id="cross"></div>
    <div id="loading">장면 생성 중…</div>
    <div id="help">
        <b>화면 클릭</b> 시점 고정 · <b>WASD</b> 이동 · <b>마우스</b> 시점 · <b>Shift</b> 달리기<br>
        <b>F</b> 비행 · <b>Space / C</b> 위·아래(비행) · <b>Esc</b> 마우스 해제 · <b>1 / 2 / 3</b> 장면
    </div>
    <input type="file" id="model-file-input" accept=".obj,.gltf,.glb" style="display:none">

    <script type="module" src="./js/main.js?v=a3432433"></script>
</body>
</html>
